    <!-- FAQ: generato dal contenuto di translations.<lang>.faq in src/App.jsx -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Quante persone può ospitare la casa?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Fino a 7 ospiti in 3 camere da letto: due camere con letto matrimoniale e una terza con un letto a una piazza e mezza più un letto a castello. I bagni sono due, entrambi con doccia."
            }
          },
          {
            "@type": "Question",
            "name": "Quanto dista davvero il mare?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Dieci metri. La spiaggia libera è appena fuori dalla porta di casa: non serve prendere l'auto, né attraversare strade trafficate."
            }
          },
          {
            "@type": "Question",
            "name": "Qual è il soggiorno minimo?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Due notti in bassa stagione e quattro notti in alta stagione."
            }
          },
          {
            "@type": "Question",
            "name": "A che ora sono il check-in e il check-out?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Il check-in è dalle 15:00, il check-out entro le 11:00. Se hai un volo o un treno con orari difficili, scrivici: cerchiamo di venirti incontro quando il calendario lo permette."
            }
          },
          {
            "@type": "Question",
            "name": "Le pulizie finali sono incluse?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No, si aggiungono al costo del soggiorno e costano 99 €. È un importo unico, indipendente dalla durata del soggiorno e dal numero di ospiti."
            }
          },
          {
            "@type": "Question",
            "name": "È prevista una cauzione?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sì, 500 €, da versare all'arrivo in struttura. Viene restituita per intero alla fine del soggiorno, salvo danni."
            }
          },
          {
            "@type": "Question",
            "name": "Si paga la tassa di soggiorno?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sì, si versa in struttura ed è dovuta al Comune di Bari, non a noi. Il regolamento comunale prevede esenzioni — per i minori e oltre un certo numero di notti consecutive — quindi l'importo esatto te lo confermiamo al momento della prenotazione, in base a quanti siete e quanto vi fermate."
            }
          },
          {
            "@type": "Question",
            "name": "Lenzuola e asciugamani sono inclusi?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sì, lenzuola e asciugamani sono inclusi e già pronti al tuo arrivo. In casa trovi anche sapone, asciugacapelli, lavatrice e stendibiancheria."
            }
          },
          {
            "@type": "Question",
            "name": "C'è il parcheggio?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sì, due posti auto privati e gratuiti all'interno della proprietà, con spazio anche per scooter e biciclette. Fuori dalla struttura il parcheggio è libero e gratuito."
            }
          },
          {
            "@type": "Question",
            "name": "Sono ammessi gli animali?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sì, cani e gatti di taglia piccola e media sono benvenuti, con un lieve supplemento sulle pulizie. Segnalacelo al momento della prenotazione."
            }
          },
          {
            "@type": "Question",
            "name": "Si può fumare?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Solo all'esterno. Il giardino e gli spazi all'aperto sono a disposizione; all'interno della casa non si fuma."
            }
          },
          {
            "@type": "Question",
            "name": "C'è l'aria condizionata?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sì, in tutte e tre le camere da letto e in salotto, con funzione sia di raffrescamento sia di riscaldamento. La casa è quindi confortevole anche fuori stagione."
            }
          },
          {
            "@type": "Question",
            "name": "Com'è la connessione internet?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Wi-Fi in fibra fino a 500 Mbps in tutta la casa. È una connessione adatta anche a chi deve lavorare o fare videochiamate durante il soggiorno."
            }
          },
          {
            "@type": "Question",
            "name": "Avete attrezzature per bambini piccoli?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sì: seggiolone, culla, sponde per il letto e fasciatoio, senza costi aggiuntivi. Vanno però richiesti al momento della prenotazione, così troviamo tutto già pronto al tuo arrivo."
            }
          },
          {
            "@type": "Question",
            "name": "Si possono organizzare feste o eventi?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No, feste ed eventi non sono consentiti. La casa è pensata per famiglie e gruppi che cercano tranquillità, e ci teniamo al rapporto con il vicinato."
            }
          },
          {
            "@type": "Question",
            "name": "C'è la piscina?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No, e non è una dimenticanza: la casa è a dieci metri dal mare, con la spiaggia libera appena fuori dalla porta. Chi cerca la villa con piscina nell'entroterra troverà di meglio altrove; chi vuole scendere in spiaggia scalzo è nel posto giusto. In giardino ci sono comunque oltre 12 posti a sedere all'aperto e il barbecue."
            }
          },
          {
            "@type": "Question",
            "name": "Come si arriva a Torre a Mare?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "In auto, circa 15 minuti dal centro di Bari e 25 dall'aeroporto. In treno, Torre a Mare ha una propria fermata sulla linea Bari-Lecce, a pochi minuti dalla stazione centrale di Bari. Una volta qui, l'auto non è indispensabile per il mare e il borgo, ma è comoda per visitare la Puglia."
            }
          }
        ]
      }
    </script>

  <body>
    <!-- Dichiarazione del modulo per Netlify Forms.
         Netlify scopre i moduli leggendo l'HTML pubblicato, ma il modulo vero
         lo disegna React nel browser, dove Netlify non arriva: questa copia
         statica e nascosta serve solo a dichiararne nome e campi. Il nome e
         l'elenco dei campi devono restare identici a quelli del componente
         ContactForm in src/App.jsx, altrimenti gli invii vengono rifiutati.
         Basta che esista in una pagina del sito: vale per tutte. -->
    <form name="richiesta-disponibilita" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="nome" />
      <input type="email" name="email" />
      <input type="date" name="arrivo" />
      <input type="date" name="partenza" />
      <input type="text" name="ospiti" />
      <textarea name="messaggio"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
