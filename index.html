    <!-- Google tag (gtag.js) — Google Analytics, con Consent Mode v2: nessun

         il sito non usa pubblicità o remarketing, solo statistiche. -->

      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {

        'ad_user_data': 'denied',
        'ad_personalization': 'denied',
        'analytics_storage': 'denied'

    <!-- Coppia hreflang: dice ai motori di ricerca che questa pagina e

         versione giusta a seconda del paese di chi cerca. x-default indica
         quale servire a chi non rientra in nessuna delle due.
         Se si aggiunge una lingua, va aggiunta in tutti e tre i posti:
         qui, in en/index.html e in public/sitemap.xml. -->

    <link rel="alternate" hreflang="en" href="https://bellavistadomus.netlify.app/en/" />

    <!-- La fotografia dell'hero è l'immagine che Google cronometra come LCP.

         eseguito il bundle React: il preload la fa partire subito, in
         parallelo. Se cambia il percorso in CONFIG.images.hero (src/App.jsx),
         va aggiornato anche qui. -->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <body>
    <!-- Dichiarazione del modulo per Netlify Forms.
         Netlify scopre i moduli leggendo l'HTML pubblicato, ma il modulo vero
         lo disegna React nel browser, dove Netlify non arriva: questa copia
         statica e nascosta serve solo a dichiararne nome e campi. Il nome e
         l'elenco dei campi devono restare identici a quelli del componente
         ContactForm in src/App.jsx, altrimenti gli invii vengono rifiutati.
         Basta che esista in una pagina del sito: vale per tutte. -->
    <form name="richiesta-disponibilita" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="nome" />
      <input type="email" name="email" />
      <input type="date" name="arrivo" />
      <input type="date" name="partenza" />
      <input type="text" name="ospiti" />
      <textarea name="messaggio"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
