    <!-- La fotografia dell'hero è l'immagine che Google cronometra come LCP.
         Senza questo preload il browser la scopre solo dopo aver scaricato ed
         eseguito il bundle React: il preload la fa partire subito, in parallelo.

         Deve elencare le stesse varianti WebP dell'elemento <picture> in
         PhotoSlot, con lo stesso "sizes": se preloadassimo il JPEG, il
         browser scaricherebbe quello E POI la variante WebP scelta, cioè
         il doppio. Se cambia CONFIG.images.hero o l'elenco delle varianti
         in src/App.jsx, va aggiornato anche qui. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/images/hero.webp"
      imagesrcset="/images/hero-480.webp 480w, /images/hero-900.webp 900w, /images/hero-1400.webp 1400w, /images/hero.webp 1900w"
      imagesizes="100vw"
      fetchpriority="high"
    />

            <!-- FAQ: generato dal contenuto di translations.<lang>.faq in src/App.jsx -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Is it cheaper to book direct?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes: if you book directly with us, by email, WhatsApp or the form on this site, you get up to 25% off the Booking.com and Airbnb rates for the same dates, because you pay no platform commission. The exact percentage depends on your dates: we confirm it in your quote."
            }
          },
          {
            "@type": "Question",
            "name": "How many guests can the house sleep?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Up to 7 guests in 3 bedrooms: two bedrooms with a double bed, and a third with a small double bed plus a bunk bed. There are two bathrooms, both with a shower."
            }
          },
          {
            "@type": "Question",
            "name": "How far is the sea, really?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Ten metres, with a sandy cove right in front of the house. You cross the road and you are on the free public beach, where sand alternates with rocks. The sea is visible from two of the three bedrooms, and you can hear it in the evening with the windows open."
            }
          },
          {
            "@type": "Question",
            "name": "What is the minimum stay?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Two nights in low season and four nights in high season."
            }
          },
          {
            "@type": "Question",
            "name": "What are the check-in and check-out times?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Check-in is from 3:00 pm and check-out by 11:00 am. If your flight or train times are awkward, do write to us: we try to accommodate you whenever the calendar allows."
            }
          },
          {
            "@type": "Question",
            "name": "Is the final cleaning included?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No, it is added to the cost of the stay and comes to €99. It is a single charge, regardless of how long you stay or how many of you there are."
            }
          },
          {
            "@type": "Question",
            "name": "Is there a tourist tax?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. It is paid at the property and is owed to the Municipality of Bari, not to us. The municipal regulation provides exemptions — for children and beyond a certain number of consecutive nights — so we confirm the exact amount when you book, based on how many you are and how long you stay."
            }
          },
          {
            "@type": "Question",
            "name": "Are bed linen and towels included?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, bed linen and towels are included and ready when you arrive. You will also find soap, a hairdryer, a washing machine and a clothes airer."
            }
          },
          {
            "@type": "Question",
            "name": "Is there parking?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, two free private parking spaces within the property, with room for scooters and bicycles too. Outside the property, on-street parking is free and unrestricted."
            }
          },
          {
            "@type": "Question",
            "name": "Are pets allowed?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, small and medium sized dogs and cats are welcome, with a small cleaning surcharge. Please let us know when you book."
            }
          },
          {
            "@type": "Question",
            "name": "Is smoking allowed?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Outdoors only. The garden and outdoor spaces are at your disposal; there is no smoking inside the house."
            }
          },
          {
            "@type": "Question",
            "name": "Is there air conditioning?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, in all three bedrooms and in the living room, with both cooling and heating. The house is therefore comfortable outside the summer season too."
            }
          },
          {
            "@type": "Question",
            "name": "What is the internet connection like?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Fibre Wi-Fi up to 500 Mbps throughout the house. It is fast enough for working and video calls during your stay."
            }
          },
          {
            "@type": "Question",
            "name": "Do you have equipment for small children?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes: a high chair, cot, bed rails and a changing mat, at no extra cost. Please request them when you book, so everything is ready when you arrive."
            }
          },
          {
            "@type": "Question",
            "name": "Can I host a party or an event?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No, parties and events are not allowed. The house is designed for families and groups looking for peace and quiet, and we value our relationship with the neighbours."
            }
          },
          {
            "@type": "Question",
            "name": "Is there a swimming pool?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Not yet: a pool is planned for summer 2027. Today the house offers something else — ten metres from the sea, with a sandy cove in front, and a private garden with over 12 outdoor seats and a barbecue. If you are considering a stay in summer 2027, write to us before booking: we will tell you where the works stand, so you are not booking on an expectation."
            }
          },
          {
            "@type": "Question",
            "name": "How do I get to Torre a Mare?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "By car, take the Torre a Mare centro exit and you are at the house in two minutes; from Bari airport it is about 20 minutes, 25 with traffic. By public transport the simplest way is bus 12 (or 12/) from Bari central station. Once here, you will not need a car for the beach and the village; for shopping and errands you will, as they are about five minutes away."
            }
          }
        ]
      }
    </script>
