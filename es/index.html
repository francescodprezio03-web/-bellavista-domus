    <!-- La fotografia dell'hero è l'immagine che Google cronometra come LCP.
         Senza questo preload il browser la scopre solo dopo aver scaricato ed
         eseguito il bundle React: il preload la fa partire subito, in parallelo.

         Deve elencare le stesse varianti WebP dell'elemento <picture> in
         PhotoSlot, con lo stesso "sizes": se preloadassimo il JPEG, il
         browser scaricherebbe quello E POI la variante WebP scelta, cioè
         il doppio. Se cambia CONFIG.images.hero o l'elenco delle varianti
         in src/App.jsx, va aggiornato anche qui. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/images/hero.webp"
      imagesrcset="/images/hero-480.webp 480w, /images/hero-900.webp 900w, /images/hero-1400.webp 1400w, /images/hero.webp 1900w"
      imagesizes="100vw"
      fetchpriority="high"
    />

    <!-- FAQ: generato dal contenuto di translations.<lang>.faq in src/App.jsx -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "¿Sale más barato reservar directamente?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sí: si reservas directamente con nosotros, por email, WhatsApp o con el formulario de la web, tienes hasta un 25 % de descuento respecto a las tarifas de Booking.com y Airbnb para las mismas fechas, porque no pagas las comisiones de las plataformas. El porcentaje exacto depende de las fechas: te lo confirmamos en el presupuesto."
            }
          },
          {
            "@type": "Question",
            "name": "¿Cuántas personas caben en la casa?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Hasta 7 huéspedes en 3 dormitorios: dos con cama de matrimonio y un tercero con una cama doble pequeña y una litera. Hay dos baños, ambos con ducha."
            }
          },
          {
            "@type": "Question",
            "name": "¿A qué distancia está realmente el mar?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A diez metros, con una pequeña cala de arena justo delante de la casa. Se cruza la calle y ya estás en la playa pública, donde se alternan arena y rocas. El mar se ve desde dos de los tres dormitorios, y por la noche se oye con las ventanas abiertas."
            }
          },
          {
            "@type": "Question",
            "name": "¿Cuál es la estancia mínima?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Dos noches en temporada baja y cuatro noches en temporada alta."
            }
          },
          {
            "@type": "Question",
            "name": "¿A qué hora son el check-in y el check-out?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "El check-in es a partir de las 15:00 y el check-out antes de las 11:00. Si tienes un vuelo o un tren con horarios complicados, escríbenos: intentamos adaptarnos cuando el calendario lo permite."
            }
          },
          {
            "@type": "Question",
            "name": "¿Está incluida la limpieza final?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No, se suma al precio de la estancia y cuesta 99 €. Es un importe único, que no depende de la duración de la estancia ni del número de huéspedes."
            }
          },
          {
            "@type": "Question",
            "name": "¿Hay que pagar la tasa turística?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sí, se paga en el alojamiento y corresponde al Ayuntamiento de Bari, no a nosotros. El reglamento municipal prevé exenciones —para los menores y a partir de cierto número de noches seguidas—, así que te confirmamos el importe exacto al reservar, según cuántos seáis y cuántas noches os quedéis."
            }
          },
          {
            "@type": "Question",
            "name": "¿Están incluidas las sábanas y las toallas?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sí, las sábanas y las toallas están incluidas y listas a tu llegada. En la casa también encontrarás jabón, secador de pelo, lavadora y tendedero."
            }
          },
          {
            "@type": "Question",
            "name": "¿Hay aparcamiento?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sí, dos plazas de aparcamiento privadas y gratuitas dentro de la propiedad, con espacio también para motos y bicicletas. Fuera, en la calle, el aparcamiento es libre y gratuito."
            }
          },
          {
            "@type": "Question",
            "name": "¿Se admiten mascotas?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sí, los perros y gatos de tamaño pequeño y mediano son bienvenidos, con un pequeño suplemento de limpieza. Avísanos al hacer la reserva."
            }
          },
          {
            "@type": "Question",
            "name": "¿Se puede fumar?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Solo en el exterior. El jardín y los espacios al aire libre están a tu disposición; dentro de la casa no se fuma."
            }
          },
          {
            "@type": "Question",
            "name": "¿Hay aire acondicionado?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sí, en los tres dormitorios y en el salón, con función de frío y de calor. Por eso la casa es cómoda también fuera de temporada."
            }
          },
          {
            "@type": "Question",
            "name": "¿Cómo es la conexión a internet?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Wi-Fi de fibra hasta 500 Mbps en toda la casa. Es una conexión adecuada también para quien tenga que trabajar o hacer videollamadas durante la estancia."
            }
          },
          {
            "@type": "Question",
            "name": "¿Tenéis equipamiento para niños pequeños?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sí: trona, cuna, barreras de cama y cambiador, sin coste adicional. Eso sí, hay que pedirlos al reservar, para tenerlo todo listo a tu llegada."
            }
          },
          {
            "@type": "Question",
            "name": "¿Se pueden organizar fiestas o eventos?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No, no se permiten fiestas ni eventos. La casa está pensada para familias y grupos que buscan tranquilidad, y cuidamos mucho la relación con los vecinos."
            }
          },
          {
            "@type": "Question",
            "name": "¿Hay piscina?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Todavía no: hay una piscina prevista para el verano de 2027. Hoy la casa apuesta por otra cosa —el mar a diez metros, con la cala de arena delante, y un jardín privado con más de 12 asientos al aire libre y barbacoa—. Si estás pensando en una estancia en el verano de 2027, escríbenos antes de reservar: te diremos cómo van las obras, para que no reserves basándote en una expectativa."
            }
          },
          {
            "@type": "Question",
            "name": "¿Cómo se llega a Torre a Mare?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "En coche, se sale en Torre a Mare centro y en dos minutos estás en casa; desde el aeropuerto de Bari se tarda unos 20 minutos, 25 con tráfico. En transporte público, lo más sencillo es el autobús 12 (o 12/) desde la estación central de Bari. Una vez aquí, para la playa y el pueblo no hace falta el coche; para la compra y los servicios sí, que están a unos cinco minutos."
            }
          }
        ]
      }
    </script>
