    <!-- La fotografia dell'hero è l'immagine che Google cronometra come LCP.
         Senza questo preload il browser la scopre solo dopo aver scaricato ed
         eseguito il bundle React: il preload la fa partire subito, in parallelo.

         Deve elencare le stesse varianti WebP dell'elemento <picture> in
         PhotoSlot, con lo stesso "sizes": se preloadassimo il JPEG, il
         browser scaricherebbe quello E POI la variante WebP scelta, cioè
         il doppio. Se cambia CONFIG.images.hero o l'elenco delle varianti
         in src/App.jsx, va aggiornato anche qui. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/images/hero.webp"
      imagesrcset="/images/hero-480.webp 480w, /images/hero-900.webp 900w, /images/hero-1400.webp 1400w, /images/hero.webp 1900w"
      imagesizes="100vw"
      fetchpriority="high"
    />

          {

            "name": "Lohnt es sich, direkt zu buchen?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Ja: Wenn Sie direkt bei uns buchen, per E-Mail, WhatsApp oder über das Formular auf der Website, erhalten Sie bis zu 25 % Rabatt gegenüber den Preisen von Booking.com und Airbnb für dieselben Daten, weil Sie keine Provisionen der Plattformen zahlen. Der genaue Prozentsatz hängt von den Daten ab: Wir bestätigen ihn Ihnen im Angebot."

          },
          {
            "@type": "Question",
            "name": "Wie viele Personen finden im Haus Platz?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Bis zu 7 Gäste in 3 Schlafzimmern: zwei Schlafzimmer mit Doppelbett und ein drittes mit einem kleinen Doppelbett und einem Etagenbett. Es gibt zwei Badezimmer, beide mit Dusche."

            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Zehn Meter, mit einer kleinen Sandbucht direkt vor dem Haus. Man überquert die Straße und ist am freien Strand, wo sich Sand und Felsen abwechseln. Das Meer sieht man von zwei der drei Schlafzimmer aus, und abends hört man es bei offenem Fenster."
            }
          },
          {
            "@type": "Question",
            "name": "Wie lange ist der Mindestaufenthalt?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Zwei Nächte in der Nebensaison und vier Nächte in der Hochsaison."
            }
          },
          {
            "@type": "Question",
            "name": "Wann sind Check-in und Check-out?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Check-in ist ab 15:00 Uhr, Check-out bis 11:00 Uhr. Wenn Ihr Flug oder Zug zu ungünstigen Zeiten geht, schreiben Sie uns: Wir versuchen, Ihnen entgegenzukommen, wenn der Kalender es erlaubt."

          },

            "@type": "Question",
            "name": "Ist die Endreinigung inbegriffen?",

              "@type": "Answer",

          },

              "@type": "Answer",

          {
            "@type": "Question",
            "name": "Muss man Kurtaxe zahlen?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Ja, sie wird vor Ort bezahlt und steht der Gemeinde Bari zu, nicht uns. Die städtische Satzung sieht Befreiungen vor – für Minderjährige und ab einer bestimmten Zahl aufeinanderfolgender Nächte –, daher bestätigen wir Ihnen den genauen Betrag bei der Buchung, je nachdem, wie viele Sie sind und wie lange Sie bleiben."
            }
          },

            "@type": "Question",
            "name": "Sind Bettwäsche und Handtücher inklusive?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Ja, Bettwäsche und Handtücher sind inklusive und liegen bei Ihrer Ankunft bereit. Im Haus finden Sie außerdem Seife, einen Haartrockner, eine Waschmaschine und einen Wäscheständer."
            }
          },

            "@type": "Question",
            "name": "Gibt es einen Parkplatz?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Ja, zwei kostenlose Privatparkplätze auf dem Grundstück, mit Platz auch für Roller und Fahrräder. Außerhalb des Grundstücks ist das Parken frei und kostenlos."
            }
          },
          {
            "@type": "Question",
            "name": "Sind Haustiere erlaubt?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Ja, kleine und mittelgroße Hunde und Katzen sind willkommen, gegen einen geringen Reinigungsaufschlag. Bitte geben Sie es bei der Buchung an."

              "text": "Nur im Freien. Der Garten und die Außenbereiche stehen Ihnen zur Verfügung; im Haus wird nicht geraucht."

          },

            "@type": "Question",

            "acceptedAnswer": {

              "text": "Ja, in allen drei Schlafzimmern und im Wohnzimmer, mit Kühl- und Heizfunktion. Das Haus ist daher auch außerhalb der Saison angenehm."
            }
          },
          {
            "@type": "Question",
            "name": "Wie ist die Internetverbindung?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Glasfaser-WLAN mit bis zu 500 Mbit/s im ganzen Haus. Die Verbindung eignet sich auch, wenn Sie während des Aufenthalts arbeiten oder Videokonferenzen führen müssen."

          },
          {
            "@type": "Question",
            "name": "Gibt es Ausstattung für kleine Kinder?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Ja: Hochstuhl, Babybett, Bettgitter und Wickelauflage, ohne Aufpreis. Bitte fragen Sie bei der Buchung danach, damit bei Ihrer Ankunft alles bereitsteht."

          },

          },

            "@type": "Question",

              "@type": "Answer",

            }
          },

            "@type": "Question",
            "name": "Wie kommt man nach Torre a Mare?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Mit dem Auto nimmt man die Ausfahrt Torre a Mare centro und ist in zwei Minuten am Haus; vom Flughafen Bari sind es etwa 20 Minuten, 25 bei Verkehr. Mit öffentlichen Verkehrsmitteln ist der Bus 12 (oder 12/) ab dem Hauptbahnhof Bari am einfachsten. Vor Ort braucht man für den Strand und den Ort kein Auto; für Einkäufe und Besorgungen schon, sie sind etwa fünf Minuten entfernt."
            }
