    <!-- La fotografia dell'hero è l'immagine che Google cronometra come LCP.
         Senza questo preload il browser la scopre solo dopo aver scaricato ed
         eseguito il bundle React: il preload la fa partire subito, in parallelo.

         Deve elencare le stesse varianti WebP dell'elemento <picture> in
         PhotoSlot, con lo stesso "sizes": se preloadassimo il JPEG, il
         browser scaricherebbe quello E POI la variante WebP scelta, cioè
         il doppio. Se cambia CONFIG.images.hero o l'elenco delle varianti
         in src/App.jsx, va aggiornato anche qui. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/images/hero.webp"
      imagesrcset="/images/hero-480.webp 480w, /images/hero-900.webp 900w, /images/hero-1400.webp 1400w, /images/hero.webp 1900w"
      imagesizes="100vw"
      fetchpriority="high"
    />

            <!-- FAQ: generato dal contenuto di translations.<lang>.faq in src/App.jsx -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Est-il plus avantageux de réserver en direct ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Oui : si vous réservez directement auprès de nous, par e-mail, WhatsApp ou avec le formulaire du site, vous avez jusqu'à 25 % de réduction par rapport aux tarifs de Booking.com et Airbnb pour les mêmes dates, car vous ne payez pas les commissions des plateformes. Le pourcentage exact dépend des dates : nous vous le confirmons dans le devis."
            }
          },
          {
            "@type": "Question",
            "name": "Combien de personnes la maison peut-elle accueillir ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Jusqu'à 7 personnes dans 3 chambres : deux chambres avec lit double et une troisième avec un petit lit double et des lits superposés. Il y a deux salles de bains, toutes deux avec douche."
            }
          },
          {
            "@type": "Question",
            "name": "À quelle distance se trouve vraiment la mer ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Dix mètres, avec une petite anse de sable juste devant la maison. On traverse la route et on est sur la plage publique, où sable et rochers alternent. La mer se voit depuis deux des trois chambres, et on l'entend le soir, fenêtres ouvertes."
            }
          },
          {
            "@type": "Question",
            "name": "Quelle est la durée minimale du séjour ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Deux nuits en basse saison et quatre nuits en haute saison."
            }
          },
          {
            "@type": "Question",
            "name": "À quelle heure se font l'arrivée et le départ ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "L'arrivée se fait à partir de 15h00, le départ avant 11h00. Si votre vol ou votre train a des horaires compliqués, écrivez-nous : nous essayons de nous adapter quand le calendrier le permet."
            }
          },
          {
            "@type": "Question",
            "name": "Le ménage de fin de séjour est-il inclus ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Non, il s'ajoute au prix du séjour et coûte 99 €. C'est un montant unique, qui ne dépend ni de la durée du séjour ni du nombre de personnes."
            }
          },
          {
            "@type": "Question",
            "name": "Faut-il payer la taxe de séjour ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Oui, elle se paie sur place et elle est due à la commune de Bari, pas à nous. Le règlement municipal prévoit des exonérations — pour les mineurs et au-delà d'un certain nombre de nuits consécutives — nous vous confirmons donc le montant exact au moment de la réservation, selon le nombre de personnes et la durée du séjour."
            }
          },
          {
            "@type": "Question",
            "name": "Les draps et les serviettes sont-ils fournis ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Oui, les draps et les serviettes sont inclus et prêts à votre arrivée. Vous trouverez aussi sur place du savon, un sèche-cheveux, un lave-linge et un étendoir."
            }
          },
          {
            "@type": "Question",
            "name": "Y a-t-il un parking ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Oui, deux places de parking privées et gratuites à l'intérieur de la propriété, avec de la place aussi pour les scooters et les vélos. À l'extérieur, le stationnement est libre et gratuit."
            }
          },
          {
            "@type": "Question",
            "name": "Les animaux sont-ils acceptés ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Oui, les chiens et les chats de petite et moyenne taille sont les bienvenus, avec un léger supplément pour le ménage. Merci de nous le signaler au moment de la réservation."
            }
          },
          {
            "@type": "Question",
            "name": "Peut-on fumer ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Uniquement à l'extérieur. Le jardin et les espaces extérieurs sont à votre disposition ; on ne fume pas à l'intérieur de la maison."
            }
          },
          {
            "@type": "Question",
            "name": "Y a-t-il la climatisation ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Oui, dans les trois chambres et au salon, avec une fonction rafraîchissement et chauffage. La maison est donc confortable aussi hors saison."
            }
          },
          {
            "@type": "Question",
            "name": "Comment est la connexion internet ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Wi-Fi fibre jusqu'à 500 Mbit/s dans toute la maison. La connexion convient aussi à ceux qui doivent travailler ou faire des visioconférences pendant le séjour."
            }
          },
          {
            "@type": "Question",
            "name": "Avez-vous des équipements pour les jeunes enfants ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Oui : chaise haute, lit bébé, barrières de lit et table à langer, sans frais supplémentaires. Il faut toutefois les demander au moment de la réservation, pour que tout soit prêt à votre arrivée."
            }
          },
          {
            "@type": "Question",
            "name": "Peut-on organiser des fêtes ou des événements ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Non, les fêtes et les événements ne sont pas autorisés. La maison est pensée pour les familles et les groupes en quête de tranquillité, et nous tenons à nos bonnes relations avec le voisinage."
            }
          },
          {
            "@type": "Question",
            "name": "Y a-t-il une piscine ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Pas encore : une piscine est prévue pour l'été 2027. Aujourd'hui, la maison mise sur autre chose — la mer à dix mètres, avec l'anse de sable juste devant, et un jardin privé avec plus de 12 places assises en plein air et le barbecue. Si vous envisagez un séjour à l'été 2027, écrivez-nous avant de réserver : nous vous dirons où en sont les travaux, pour que vous ne réserviez pas sur une simple promesse."
            }
          },
          {
            "@type": "Question",
            "name": "Comment rejoindre Torre a Mare ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "En voiture, on prend la sortie Torre a Mare centro et on est à la maison en deux minutes ; depuis l'aéroport de Bari, il faut environ 20 minutes, 25 avec la circulation. En transports en commun, le plus simple est le bus 12 (ou 12/) depuis la gare centrale de Bari. Une fois sur place, la voiture n'est pas nécessaire pour la plage et le village ; elle l'est pour les courses et les services, à environ cinq minutes."
            }
          }
        ]
      }
    </script>
